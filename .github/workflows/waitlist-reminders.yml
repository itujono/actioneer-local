name: Waitlist Reminder Notifications

on:
  schedule:
    # Run every 10 minutes (more efficient, still catches all users reliably)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  send-waitlist-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send Waitlist Reminders
        run: |
          curl -X POST 'https://whnvhuusxtnuvkhgfxnu.supabase.co/functions/v1/waitlist-reminder' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{}'
